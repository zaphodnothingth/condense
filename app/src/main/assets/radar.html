<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="file:///android_asset/leaflet.css" />
    <script src="file:///android_asset/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #141416;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }
        .leaflet-control-attribution { display: none !important; }
        .leaflet-container { background: #141416 !important; }
        .user-marker {
            width: 14px;
            height: 14px;
            background: #D71920;
            border: 2.5px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(215, 25, 32, 0.8);
        }
        .radar-controls {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(20, 20, 22, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid #2C2C2E;
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: auto;
        }
        .btn {
            background: #D71920;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        .time-label {
            font-size: 13px;
            font-weight: bold;
            color: #FFFFFF;
        }
        .sub-label {
            font-size: 10px;
            color: #8E8E93;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="radar-controls">
        <div style="display: flex; align-items: center;">
            <button class="btn" id="playBtn" onclick="togglePlay()">⏸</button>
            <div style="margin-left: 12px;">
                <div class="sub-label">Live Doppler Radar</div>
                <div class="time-label" id="timeLabel">Live</div>
            </div>
        </div>
        <button class="btn" style="background: #2C2C2E;" onclick="recenter()">📍</button>
    </div>

    <script>
        let map = null;
        let userMarker = null;
        let radarLayers = [];
        let currentIndex = 0;
        let isPlaying = true;
        let timer = null;
        let currentLat = 36.76;
        let currentLon = -76.28;

        function initMap() {
            if (map) return;
            map = L.map('map', {
                center: [currentLat, currentLon],
                zoom: 8,
                zoomControl: false,
                attributionControl: false
            });

            // Pure Dark CartoDB Base Map
            L.tileLayer('https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);

            const userIcon = L.divIcon({
                className: 'user-marker',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
            userMarker = L.marker([currentLat, currentLon], { icon: userIcon }).addTo(map);

            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 250);
        }

        function updateRadar(lat, lon, host, frames) {
            currentLat = lat;
            currentLon = lon;
            initMap();

            if (userMarker) {
                userMarker.setLatLng([lat, lon]);
            }
            map.setView([lat, lon], 8);

            // Clean up old layers
            radarLayers.forEach(item => {
                if (map.hasLayer(item.layer)) map.removeLayer(item.layer);
            });
            radarLayers = [];

            if (frames && frames.length > 0) {
                frames.forEach(frame => {
                    const layer = L.tileLayer(host + frame.path + '/256/{z}/{x}/{y}/2/1_1.png', {
                        opacity: 0,
                        zIndex: 100,
                        maxZoom: 19,
                        maxNativeZoom: 12
                    });
                    layer.addTo(map);
                    radarLayers.push({ layer: layer, time: frame.time });
                });

                currentIndex = radarLayers.length - 1;
                showFrame(currentIndex);
                if (timer) clearInterval(timer);
                timer = setInterval(step, 650);
            }
            setTimeout(() => { if (map) map.invalidateSize(); }, 300);
        }

        function showFrame(index) {
            if (!radarLayers.length) return;
            radarLayers.forEach((item, i) => {
                item.layer.setOpacity(i === index ? 0.75 : 0);
            });
            const date = new Date(radarLayers[index].time * 1000);
            document.getElementById('timeLabel').innerText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function step() {
            if (!isPlaying || !radarLayers.length) return;
            currentIndex = (currentIndex + 1) % radarLayers.length;
            showFrame(currentIndex);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? '⏸' : '▶';
        }

        function recenter() {
            if (map) {
                map.setView([currentLat, currentLon], 8);
                map.invalidateSize();
            }
        }

        window.onload = function() {
            initMap();
        };
        window.addEventListener('resize', function() {
            if (map) map.invalidateSize();
        });
    </script>
</body>
</html>
